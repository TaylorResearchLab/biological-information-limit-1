name: Reproduce each biological example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tcell
            script: examples/01_tcell_proofreading/run_tcell_proofreading.py
            extra: ""
          - name: ribosome
            script: examples/02_ribosome_selection/run_ribosome_selection.py
            extra: ""
          - name: msn2
            script: examples/03_msn2_reporters/run_msn2_reporters.py
            extra: "--full-derived"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - run: python verify_sources.py
      - run: python -m unittest discover -s tests -v
      - run: python ${{ matrix.script }} --out runs/${{ matrix.name }} ${{ matrix.extra }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: example-${{ matrix.name }}
          path: runs/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30
