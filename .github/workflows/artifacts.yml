name: Regenerate published artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - run: python verify_sources.py
      - run: python -m unittest discover -s tests -v
      - run: python generate_artifacts.py --out runs/artifacts_ci
      - name: Compare regenerated results with published artifacts
        env:
          BICS_REGENERATED_ARTIFACTS: runs/artifacts_ci
        run: python -m unittest discover -s tests -v
      - name: Confirm the repository files were preserved
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regenerated-artifacts
          path: runs/artifacts_ci/
          if-no-files-found: error
          retention-days: 30
