name: Publish first artifact snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_artifacts_once.yml']
permissions:
  contents: write
concurrency:
  group: first-artifact-snapshot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - run: python verify_archive.py
      - run: python -m unittest discover -s tests -v
      - run: python generate_artifacts.py --out runs/publication
      - name: Save the verified snapshot on main without replacing existing files
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          from generate_artifacts import validate_bundle
          root = pathlib.Path.cwd()
          source = root / 'runs/publication'
          report = validate_bundle(source)
          if (root / 'artifacts').exists():
              raise RuntimeError('artifacts already exists; this one-time publication never overwrites it')
          if subprocess.check_output(['git', 'diff', '--name-only']).strip():
              raise RuntimeError('A tracked source file changed during the run')
          if any(pathlib.Path(p).suffix not in ('.csv', '.json', '.log', '.png', '.md') for p in report['files']):
              raise RuntimeError('Unexpected artifact format')
          shutil.copytree(source, root / 'artifacts')
          validate_bundle(root / 'artifacts')
          PY
          git add -- artifacts
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          if not paths or any(not p.startswith('artifacts/') for p in paths):
              raise RuntimeError('Publication may contain only artifacts/')
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish generated tables, figures and verification records on main'
          git push origin HEAD:main
      - name: Export checkout for read-back verification
        if: always()
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/source_checkout.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artifact-publication-verification
          path: |
            ${{ runner.temp }}/source_checkout.tar.gz
            runs/publication/
          if-no-files-found: error
          retention-days: 30
