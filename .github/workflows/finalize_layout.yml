name: Verify and publish submission layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize_layout.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: submission-layout
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - name: Migrate and verify the approved submission structure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, subprocess, sys, urllib.request
          sha = '6d077d2881efdfa41d633bdf7bd4053d19cb2ad2'
          request = urllib.request.Request(
              'https://api.github.com/repos/TaylorResearchLab/biological-information-limit-1/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              content = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
          ast.parse(content.decode())
          script = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apply_submission_layout.py'
          script.write_bytes(content)
          subprocess.run([sys.executable, str(script)], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: submission-layout-verification
          path: ${{ runner.temp }}/bics_layout/
          if-no-files-found: error
          retention-days: 30
