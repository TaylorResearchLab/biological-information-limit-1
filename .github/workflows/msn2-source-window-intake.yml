name: Validate Msn2 source-window sensitivity
on:
  push:
    branches: [work/msn2-source-window-sensitivity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests/test_msn2_source_window.py
      - name: Download the public eLife supplement
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/elife-06559-supp-v1.zip \
            https://cdn.elifesciences.org/articles/06559/elife-06559-supp-v1.zip
      - name: Generate and independently validate the sensitivity record
        run: |
          mkdir -p runs/source_window_first runs/source_window_second
          python tools/check_msn2_source_window.py \
            --archive /tmp/elife-06559-supp-v1.zip \
            --out runs/source_window_first/msn2_source_window_sensitivity.json
          python tools/check_msn2_source_window.py \
            --archive /tmp/elife-06559-supp-v1.zip \
            --out runs/source_window_second/msn2_source_window_sensitivity.json
          cmp \
            runs/source_window_first/msn2_source_window_sensitivity.json \
            runs/source_window_second/msn2_source_window_sensitivity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msn2-source-window-sensitivity
          path: runs/source_window_first/msn2_source_window_sensitivity.json
          if-no-files-found: error
          retention-days: 30
      - name: Package the tested checkout
        run: |
          tar --exclude=.git --exclude=runs -czf /tmp/biological-information-limit-1-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-source-checkout
          path: /tmp/biological-information-limit-1-source.tar.gz
          if-no-files-found: error
          retention-days: 30
