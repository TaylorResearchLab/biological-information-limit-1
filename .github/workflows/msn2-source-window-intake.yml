name: Finalize Msn2 source-window sensitivity
on:
  push:
    branches: [work/msn2-source-window-sensitivity]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/msn2-source-window-sensitivity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests/test_msn2_source_window.py
      - name: Download the public eLife supplement
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/elife-06559-supp-v1.zip \
            https://cdn.elifesciences.org/articles/06559/elife-06559-supp-v1.zip
      - name: Generate and compare two independent sensitivity records
        run: |
          mkdir -p runs/source_window_first runs/source_window_second
          python tools/check_msn2_source_window.py \
            --archive /tmp/elife-06559-supp-v1.zip \
            --out runs/source_window_first/msn2_source_window_sensitivity.json
          python tools/check_msn2_source_window.py \
            --archive /tmp/elife-06559-supp-v1.zip \
            --out runs/source_window_second/msn2_source_window_sensitivity.json
          cmp \
            runs/source_window_first/msn2_source_window_sensitivity.json \
            runs/source_window_second/msn2_source_window_sensitivity.json
      - name: Integrate the reviewed record and remove temporary intake files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize_msn2_source_window_intake.py')
          text = path.read_text(encoding='utf-8')
          old = "def refresh_artifact_indexes() -> None:\n    bundle.write_index(ROOT / \"artifacts\")"
          new = "def refresh_artifact_indexes() -> None:\n    import importlib\n    importlib.reload(bundle)\n    bundle.write_index(ROOT / \"artifacts\")"
          if text.count(old) != 1:
              raise SystemExit('Could not patch the one-run finalizer')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/finalize_msn2_source_window_intake.py \
            --generated runs/source_window_first/msn2_source_window_sensitivity.json
          cmp \
            runs/source_window_first/msn2_source_window_sensitivity.json \
            provenance/msn2_source_window_sensitivity.json
      - name: Verify source identities and repository tests
        run: |
          python verify_sources.py
          python -m unittest discover -s tests -v
      - name: Regenerate and compare the complete artifact bundle
        run: |
          python generate_artifacts.py --out runs/final_artifact_check
          BICS_REGENERATED_ARTIFACTS=runs/final_artifact_check \
            python -m unittest discover -s tests -p test_artifacts.py -v
      - name: Commit the validated integration
        run: |
          git diff --check
          git config user.name "Deanne Taylor"
          git config user.email "deannetaylorphd@gmail.com"
          git add -A
          git commit -m "Add validated Msn2 source-window sensitivity audit"
          git push origin HEAD:work/msn2-source-window-sensitivity
